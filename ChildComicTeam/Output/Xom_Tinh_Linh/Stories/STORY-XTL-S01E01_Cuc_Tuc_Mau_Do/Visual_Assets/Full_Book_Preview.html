<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xóm Tinh Linh — Cục Tức Màu Đỏ — Rough Preview</title>
  <style>
    :root { color-scheme: light; --paper:#f6efdf; --ink:#2b2722; --card:#fffaf0; --accent:#8e372c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,sans-serif; }
    header { max-width:768px; margin:auto; padding:20px 16px 12px; }
    h1 { margin:0 0 8px; font-size:clamp(22px,5vw,34px); }
    p { line-height:1.45; margin:6px 0; }
    .warning { border-left:4px solid var(--accent); padding:8px 12px; background:#fff4df; }
    main { width:min(100%,768px); margin:auto; padding:8px 12px 40px; }
    figure { margin:18px 0 28px; padding:10px; background:var(--card); border:1px solid #d6c8ad; border-radius:10px; box-shadow:0 4px 16px #4a321422; }
    object { display:block; width:100%; aspect-ratio:2/3; border:0; border-radius:4px; }
    figcaption { padding:9px 2px 0; font-size:15px; font-weight:700; }
    a:focus-visible { outline:4px solid #2d6cdf; outline-offset:4px; }
    @media (max-width:480px) {
      header { padding:14px 10px 8px; }
      main { padding:4px 6px 28px; }
      figure { margin:12px 0 20px; padding:5px; border-radius:6px; }
      figcaption { font-size:14px; }
    }
    @media print {
      @page { size:6in 9in; margin:0; }
      body { background:white; }
      header { display:none; }
      main { width:auto; padding:0; }
      figure { width:6in; height:9in; margin:0; padding:0; border:0; border-radius:0; box-shadow:none; break-after:page; page-break-after:always; overflow:hidden; }
      figure:last-child { break-after:auto; page-break-after:auto; }
      object { width:6in; height:9in; border-radius:0; }
      figcaption { display:none; }
    }
  </style>
</head>
